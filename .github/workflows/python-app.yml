name: "Workflow run monitor de precos"
on:
  push:
  schedule:
    - cron: '30 6 * * *'
permissions:
  contents: write
jobs:
  python-job:
    name: "Python job"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10.6'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Run guanabara script
        run: python guanabara.py
      - name: Run zsul script
        run: python zsul.py
      - name: Run atacadao script
        run: python atacadao.py
      - name: Run prezunic script
        run: python prezunic.py
      - name: Run paodeacucar script
        run: python paodeacucar.py
      - name: Run ifood script
        run: python ifood.py
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update: precos $(date +'%Y-%m-%d')"
          git push
